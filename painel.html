<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0B">
<title>DNBAR Dono</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style id="base"></style>
<style>
.ph{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.ph .grow{flex:1;min-width:0}.ph h1{font-size:22px}
.tabs{display:flex;gap:6px;padding:10px 16px 0}
.wrap{flex:1;overflow-y:auto;padding:12px 16px 40px}
.inner{max-width:1100px;margin:0 auto;display:grid;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.kpi b{display:block;font-family:"Sora",sans-serif;font-size:24px;font-weight:800;margin-top:4px}
.kpi span{font-size:13px;color:var(--muted);font-weight:600}
.kpi.hero{background:var(--accent);color:var(--on-accent);border:0;grid-column:span 2}
.kpi.hero span{color:inherit;opacity:.75}.kpi.hero b{font-size:34px}
.delta{font-size:13px;font-weight:800;margin-top:4px;display:block}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;display:grid;gap:10px}
.card h3{font-size:15px}
.card .sub{font-size:13px;color:var(--muted);font-weight:600}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:110px 1fr 90px;gap:10px;align-items:center;font-size:14px;font-weight:600}
.bar .track{height:12px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bar .fill{height:100%;border-radius:6px;background:var(--fg)}
.bar .v{text-align:right}
.hours{display:flex;align-items:flex-end;gap:4px;height:120px;padding-top:6px}
.hours div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.hours i{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--fg);min-height:2px}
.hours small{font-size:10px;color:var(--muted);font-weight:700}
.rank{display:grid;gap:6px}
.rank .r{display:grid;grid-template-columns:26px 1fr auto auto;gap:10px;align-items:center;font-size:14px;font-weight:600}
.rank .p{color:var(--muted);font-weight:800;text-align:center}
.rank .q{color:var(--muted)}
.log{display:grid;gap:8px;font-size:14px}
.log .r{display:grid;gap:2px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.log small{color:var(--muted);font-weight:600}
.empty{color:var(--muted);font-weight:600;font-size:14px}
.prod{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.prod .n{font-weight:800;color:var(--muted);text-align:center}
.prod .prices{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.prod input{width:96px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);padding:0 10px;font:inherit;font-weight:700}
.prod label{font-size:12px;color:var(--muted);font-weight:700;display:grid;gap:3px}
.prod .acts{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.sold-out{color:var(--bad);font-weight:800;font-size:12px}
.note-day{font-size:12px;color:var(--muted);font-weight:600}
.cat-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pl{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.pl img,.pl .ph0{width:56px;height:56px;border-radius:12px;object-fit:cover;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);font-weight:800}
.pl b{display:block}.pl small{color:var(--muted);font-weight:600}
.pl .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tagp{display:inline-block;font-size:11px;font-weight:800;padding:2px 7px;border-radius:7px;background:var(--warn);color:#1a1200;margin-left:6px}
.tago{display:inline-block;font-size:11px;font-weight:800;padding:2px 7px;border-radius:7px;background:var(--bad);color:#fff;margin-left:6px}
.modal .photo{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center}
.modal .photo img,.modal .photo .ph0{width:96px;height:96px;border-radius:16px;object-fit:cover;background:var(--surface-2)}
.sizes{display:grid;gap:8px}.sizes .r{display:grid;grid-template-columns:1fr 110px 40px;gap:8px}
.sizes input{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:0 12px;font:inherit;font-weight:700;width:100%}
.sizes .x{border-radius:12px;border:1px solid var(--line);color:var(--bad);font-weight:800}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.promo{display:grid;gap:4px;padding:12px 0;border-bottom:1px solid var(--line)}
.promo .t{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.promo .old{text-decoration:line-through;color:var(--muted);font-weight:600;margin-right:6px}
.promo.off{opacity:.55}
.state{font-size:11px;font-weight:800;padding:2px 8px;border-radius:7px}
.state.now{background:var(--ok);color:#04220f}.state.wait{background:var(--surface-2)}.state.end{background:var(--surface-2);color:var(--muted)}
.logo-prev{width:160px;height:160px;border-radius:24px;background:var(--surface-2);display:grid;place-items:center;overflow:hidden}
.logo-prev img{max-width:100%;max-height:100%}
.mode{display:grid;gap:10px}
@media (max-width:560px){.kpi.hero{grid-column:1/-1}.bar{grid-template-columns:84px 1fr 80px}}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm";
import { SUPABASE_URL, SUPABASE_KEY, sb as sbDev, makeGate, avatar, uuid, esc, hhmm, money, errMsg, isNetErr, BASE_CSS, temaSwitch, aplicaTema, parseMoney, centsToInput } from "./core.js";
document.getElementById("base").textContent = BASE_CSS;
// dono: sessão própria (e-mail e senha). gerente: aparelho do bar + foto e PIN.
const sbOwner = createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storageKey: "dnbar-dono" } });
let sb = sbOwner;
const app = document.getElementById("app");
const G = makeGate({ key: "painel", roles: ["gerente"], title: "Painel", onLogin: () => enterManager() });
const P = { mode: null, pick: null, dl: null, dlErr: "", auth: null, role: null, bar: null, tab: "resumo", period: "hoje", rep: null, loading: false, email: "", pw: "", err: "", busy: false,
  prods: [], cats: [], promos: [], hist: [], toast: null, modal: null };
const MLABEL = { pix: "Pix", debito: "Débito", credito: "Crédito", dinheiro: "Dinheiro", outro: "Outro" };
const tok = () => P.mode === "manager" ? G.token : null;
const OWNER_TABS = [["resumo", "Resumo"], ["cardapio", "Cardápio"], ["promos", "Promoções"], ["delivery", "Delivery"], ["marca", "Logo"], ["hist", "Histórico"]];
const MGR_TABS = [["cardapio", "Cardápio"], ["promos", "Promoções"], ["hist", "Histórico"]];
const WD = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
const imgUrl = u => u ? (/^https?:/.test(u) ? u : u) : "";

// "dia do bar" vai das 6h às 6h (a noite de sexta conta como sexta)
function range(p) {
  const now = new Date(); const d = new Date(now); d.setHours(6, 0, 0, 0); if (now < d) d.setDate(d.getDate() - 1);
  const day = 864e5;
  if (p === "hoje") return [d, new Date(d.getTime() + day)];
  if (p === "ontem") return [new Date(d.getTime() - day), d];
  if (p === "7d") return [new Date(d.getTime() - 6 * day), new Date(d.getTime() + day)];
  if (p === "30d") return [new Date(d.getTime() - 29 * day), new Date(d.getTime() + day)];
  if (p === "mes") { const m = new Date(d); m.setDate(1); return [m, new Date(d.getTime() + day)]; }
}
const PERIODS = [["hoje", "Hoje"], ["ontem", "Ontem"], ["7d", "7 dias"], ["30d", "30 dias"], ["mes", "Este mês"]];
const PREV = { hoje: "ontem", ontem: "anteontem", "7d": "7 dias anteriores", "30d": "30 dias anteriores", mes: "período anterior" };

async function boot() {
  const { data } = await sbOwner.auth.getSession(); P.auth = data.session;
  if (P.auth) {
    const w = await sbOwner.rpc("whoami"); P.role = w.data && w.data.role;
    if (P.role === "owner") { P.mode = "owner"; sb = sbOwner; await loadBar(); await loadReport(); }
  }
  if (!P.mode) { await G.load().catch(() => { }); if (G.user) enterManager(); }
  render();
}
async function loadBar() { const e = await sb.from("establishments").select("id,name,logo_url").single(); P.bar = e.data; }
async function enterManager() { P.mode = "manager"; sb = sbDev; P.tab = "cardapio"; await loadBar(); await loadMenu(); }
async function loadReport() {
  P.loading = true; render();
  const [f, t] = range(P.period);
  const { data, error } = await sb.rpc("owner_report", { p_from: f.toISOString(), p_to: t.toISOString() });
  P.loading = false;
  if (error) { toast("Não foi possível carregar", errMsg(error), true); return; }
  P.rep = data; render();
}
async function loadMenu() {
  const [c, p] = await Promise.all([sb.from("categories").select("id,name,area,sort,active").order("sort"),
    sb.from("products").select("id,category_id,number,name,description,image_url,price_cents,sizes,available,active,sort").eq("active", true).order("sort")]);
  if (c.error || p.error) return toast("Não foi possível carregar", errMsg(c.error || p.error), true);
  P.cats = c.data; P.prods = p.data; render();
}
async function loadPromos() {
  if (!P.prods.length) await loadMenu();
  const r = await sb.from("promotions").select("*").order("created_at", { ascending: false });
  if (r.error) return toast("Não foi possível carregar", errMsg(r.error), true);
  P.promos = r.data; render();
}
async function loadHist() { try { const { data, error } = await sb.rpc("catalog_history", { p_token: tok() }); if (error) throw error; P.hist = data; render(); } catch (e) { toast("Não foi possível carregar", errMsg(e), true); } }

const pct = (a, b) => b ? Math.round((a - b) / b * 100) : null;
function vLogin() {
  if (P.pick === "manager") return G.view().replace('<div class="switch">', '<button class="btn" data-a="pickBack">Voltar</button><div class="switch">');
  if (P.auth && P.role !== "owner" && P.pick === "owner") return `<div class="gate narrow"><h1 class="big">Conta sem acesso</h1><p class="muted">Esta conta é de aparelho do salão. O painel do dono usa o e-mail e a senha do dono.</p><button class="btn" data-a="logout">Entrar com outra conta</button></div>`;
  if (P.pick === "owner") return `<div class="gate narrow"><div class="gate-top"><button class="back" data-a="pickBack" aria-label="Voltar">‹</button><div class="eyebrow">DNBAR · Dono</div>${temaSwitch()}</div>
    <h1 class="big">Painel do<br>dono</h1><p class="muted">Faturamento, cardápio, promoções e delivery. Entre com o seu e-mail e senha.</p>
    <label class="field">E-mail<input type="email" data-in="email" autocomplete="username" value="${esc(P.email)}"></label>
    <label class="field">Senha<input type="password" data-in="pw" autocomplete="current-password" value="${esc(P.pw)}"></label>
    <div class="err">${esc(P.err)}</div><button class="btn primary block" data-a="login" ${P.busy ? "disabled" : ""}>${P.busy ? "Entrando..." : "Entrar"}</button></div>`;
  return `<div class="gate narrow"><div class="gate-top"><div class="eyebrow">DNBAR</div>${temaSwitch()}</div>
    <h1 class="big">Painel</h1><p class="muted">Quem está entrando?</p>
    <div class="mode"><button class="btn primary block" data-a="pick" data-v="owner">Sou o dono (e-mail e senha)</button>
    <button class="btn block" data-a="pick" data-v="manager">Sou gerente (foto e PIN)</button></div>
    <p class="muted" style="font-size:13px">O gerente mexe no cardápio e nas promoções. Faturamento e configurações ficam só com o dono.</p>
    <div class="switch">Outras telas: <a href="./">Garçom</a> · <a href="cozinha.html">Cozinha</a> · <a href="caixa.html">Caixa</a> · <a href="delivery.html">Delivery</a></div></div>`;
}

function vResumo() {
  const r = P.rep;
  const chips = `<div class="chips">${PERIODS.map(([k, l]) => `<button class="chip" data-a="period" data-v="${k}" aria-pressed="${P.period === k}">${l}</button>`).join("")}</div>
    <div class="note-day">O dia do bar vai das 6h às 6h: a madrugada conta no dia anterior.</div>`;
  if (!r) return chips + `<div class="empty">${P.loading ? "Carregando..." : "Sem dados."}</div>`;
  const d = pct(r.revenue, r.revenue_prev);
  const ticket = r.tables_closed ? Math.round(r.table_revenue / r.tables_closed) : 0;
  const perPerson = r.people ? Math.round(r.table_revenue / r.people) : 0;
  const methods = Object.entries(r.by_method || {}).sort((a, b) => b[1] - a[1]); const mMax = Math.max(1, ...methods.map(m => m[1]));
  const hrs = []; for (let h = 0; h < 24; h++) hrs.push([h, (r.by_hour || {})[h] || 0]);
  const used = hrs.filter(x => x[1] > 0); const hMin = used.length ? Math.min(...used.map(x => x[0])) : 17, hMax = used.length ? Math.max(...used.map(x => x[0])) : 23;
  const shown = hrs.filter(x => x[0] >= Math.min(hMin, 17) && x[0] <= Math.max(hMax, 23)); const hTop = Math.max(1, ...shown.map(x => x[1]));
  const peak = used.length ? used.reduce((a, b) => b[1] > a[1] ? b : a) : null;
  const sMax = Math.max(1, ...(r.by_staff || []).map(s => s.total));
  return chips + `
  <div class="kpis">
    <div class="kpi hero"><span>Faturamento</span><b class="num">${money(r.revenue)}</b>
      <span class="delta">${d == null ? "Sem base de comparação" : (d >= 0 ? "▲ " : "▼ ") + Math.abs(d) + "% vs " + PREV[P.period] + " (" + money(r.revenue_prev) + ")"}</span></div>
    <div class="kpi"><span>Ticket médio por mesa</span><b class="num">${money(ticket)}</b></div>
    <div class="kpi"><span>Gasto por pessoa</span><b class="num">${money(perPerson)}</b></div>
    <div class="kpi"><span>Mesas atendidas</span><b class="num">${r.tables_closed}</b><span>${r.people} pessoas</span></div>
    <div class="kpi"><span>Itens vendidos</span><b class="num">${r.items_sold}</b></div>
    <div class="kpi"><span>Venda balcão</span><b class="num">${money(r.counter_revenue)}</b><span>${r.counter_count} vendas</span></div>
    <div class="kpi"><span>Mesas abertas agora</span><b class="num">${r.open_tables}</b></div>
    ${r.delivery_count || r.delivery_revenue ? `<div class="kpi"><span>Delivery</span><b class="num">${money(r.delivery_revenue)}</b><span>${r.delivery_count} entregues${r.delivery_refused ? " · " + r.delivery_refused + " recusados" : ""}</span></div>` : ""}
  </div>
  <div class="grid2">
    <div class="card"><h3>Mais vendidos</h3>${r.top.length ? `<div class="rank">${r.top.map((p, i) => `<div class="r"><span class="p">${i + 1}</span><span>${esc(p.name)}</span><span class="q num">${p.qty}x</span><b class="num">${money(p.total)}</b></div>`).join("")}</div>` : `<div class="empty">Nenhuma venda no período.</div>`}</div>
    <div class="card"><h3>Menos vendidos</h3>${r.bottom.length ? `<div class="rank">${r.bottom.map((p, i) => `<div class="r"><span class="p">${i + 1}</span><span>${esc(p.name)}</span><span class="q num">${p.qty}x</span><b class="num">${money(p.total)}</b></div>`).join("")}</div>` : `<div class="empty">Nenhuma venda no período.</div>`}
      ${r.not_sold.length ? `<div class="sub">Não venderam nada (${r.not_sold.length}): ${esc(r.not_sold.slice(0, 12).join(", "))}${r.not_sold.length > 12 ? "..." : ""}</div>` : ""}</div>
    <div class="card"><h3>Formas de pagamento</h3>${methods.length ? `<div class="bars">${methods.map(([k, v]) => `<div class="bar"><span>${MLABEL[k] || k}</span><span class="track"><span class="fill" style="display:block;width:${Math.round(v / mMax * 100)}%"></span></span><span class="v num">${money(v)}</span></div>`).join("")}</div>` : `<div class="empty">Nenhum pagamento no período.</div>`}</div>
    <div class="card"><h3>Horário de movimento</h3><div class="sub">${peak ? `Pico às ${peak[0]}h, com ${money(peak[1])} em pedidos` : "Sem pedidos no período"}</div>
      <div class="hours" role="img" aria-label="Vendas por hora">${shown.map(([h, v]) => `<div title="${h}h: ${money(v)}"><i style="height:${Math.round(v / hTop * 100)}%"></i><small>${h}</small></div>`).join("")}</div></div>
    <div class="card"><h3>Equipe</h3><div class="sub">Valor lançado por cada pessoa</div>${(r.by_staff || []).length ? `<div class="bars">${r.by_staff.map(s => `<div class="bar"><span>${esc(s.name)}</span><span class="track"><span class="fill" style="display:block;width:${Math.round(s.total / sMax * 100)}%"></span></span><span class="v num">${money(s.total)}</span></div>`).join("")}</div>` : `<div class="empty">Sem lançamentos.</div>`}</div>
    <div class="card"><h3>Cancelamentos</h3>${r.cancellations.length ? `<div class="log">${r.cancellations.map(c => `<div class="r"><span>${c.qty} ${esc(c.item)} · <b class="num">${money(c.value)}</b></span><small>${hhmm(c.at)} · autorizado por ${esc(c.by || "?")} · ${esc(c.reason || "")}</small></div>`).join("")}</div>` : `<div class="empty">Nenhum cancelamento.</div>`}</div>
    <div class="card"><h3>Descontos</h3>${r.discounts.length ? `<div class="log">${r.discounts.map(c => `<div class="r"><span><b class="num">${money(c.value)}</b> · pedido por ${esc(c.asked_by || "?")}</span><small>${hhmm(c.at)} · autorizado por ${esc(c.by || "?")} · ${esc(c.reason || "")}</small></div>`).join("")}</div>` : `<div class="empty">Nenhum desconto.</div>`}</div>
    <div class="card"><h3>Caixa</h3>${r.cash.length ? `<div class="log">${r.cash.map(c => `<div class="r"><span>${c.status === "open" ? "Aberto agora" : (c.difference === 0 ? "Bateu certinho" : (c.difference > 0 ? "Sobrou " : "Faltou ") + money(Math.abs(c.difference)))}</span><small>${new Date(c.opened_at).toLocaleDateString("pt-BR")} · aberto ${hhmm(c.opened_at)} por ${esc(c.opened_by)}${c.closed_at ? ` · fechado ${hhmm(c.closed_at)} por ${esc(c.closed_by)}` : ""}</small></div>`).join("")}</div>` : `<div class="empty">Nenhum caixa no período.</div>`}</div>
  </div>`;
}

const priceTxt = p => p.sizes && p.sizes.length ? p.sizes.map(s => esc(s.l) + " " + money(s.v)).join(" · ") : p.price_cents == null ? "sem preço" : money(p.price_cents);
function vCardapio() {
  if (!P.cats.length) return `<div class="empty">Carregando cardápio...</div>`;
  return `<div class="card"><h3>Cardápio</h3><div class="sub">Mudou aqui, muda na hora no garçom, no caixa e no link de delivery. Pedidos já feitos mantêm o preço da hora.</div>
      <div class="chips"><button class="btn sm primary" data-a="newCat">+ Categoria</button></div></div>
    ${P.cats.map(c => { const ps = P.prods.filter(p => p.category_id === c.id);
      return `<div class="card" style="${c.active ? "" : "opacity:.6"}"><div class="cat-h"><h3>${esc(c.name)} <small class="muted">· ${c.area === "bar" ? "vai pro bar" : "vai pra cozinha"}${c.active ? "" : " · oculta"}</small></h3>
        <span class="chips"><button class="btn sm" data-a="editCat" data-v="${c.id}">Editar</button><button class="btn sm primary" data-a="newProd" data-v="${c.id}">+ Produto</button></span></div>
        ${ps.map(p => `<div class="pl">${p.image_url ? `<img src="${esc(imgUrl(p.image_url))}" alt="" loading="lazy">` : `<span class="ph0">${p.number}</span>`}
          <span><b>${p.number} · ${esc(p.name)}${p.available ? "" : `<span class="tago">ESGOTADO</span>`}${P.promos.some(r => r.product_id === p.id && r.active) ? `<span class="tagp">PROMO</span>` : ""}</b><small>${priceTxt(p)}</small></span>
          <span class="acts"><button class="btn sm" data-a="avail" data-v="${p.id}">${p.available ? "Esgotou" : "Voltou"}</button><button class="btn sm" data-a="editProd" data-v="${p.id}">Editar</button></span></div>`).join("") || `<div class="empty">Nenhum produto nesta categoria.</div>`}</div>`; }).join("")}`;
}
function promoWhen(r) {
  if (r.kind === "periodo") return "De " + new Date(r.starts_at).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" }) + " até " + new Date(r.ends_at).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" });
  return (r.weekdays.length === 7 ? "Todos os dias" : r.weekdays.slice().sort().map(d => WD[d]).join(", ")) + ", das " + r.start_time.slice(0, 5) + " às " + r.end_time.slice(0, 5);
}
function promoState(r) {
  if (!r.active) return ["end", "Encerrada"];
  if (r.kind === "periodo") { const n = Date.now(); if (n < new Date(r.starts_at)) return ["wait", "Agendada"]; if (n >= new Date(r.ends_at)) return ["end", "Terminou"]; return ["now", "Valendo agora"]; }
  const d = new Date(), t = d.toTimeString().slice(0, 5), on = r.weekdays.includes(d.getDay()) && (r.start_time.slice(0, 5) <= r.end_time.slice(0, 5) ? t >= r.start_time.slice(0, 5) && t < r.end_time.slice(0, 5) : t >= r.start_time.slice(0, 5) || t < r.end_time.slice(0, 5));
  return on ? ["now", "Valendo agora"] : ["wait", "Fora do horário"];
}

// reduz a imagem no aparelho antes de subir (foto: JPEG 900px; logo: PNG 512px com transparência)
async function shrink(file, max, type) {
  const bmp = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  const s = Math.min(1, max / Math.max(bmp.width, bmp.height)), c = document.createElement("canvas");
  c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s); c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return await new Promise(res => c.toBlob(res, type, .84));
}
async function upload(file, kind) {
  const isLogo = kind === "logo", type = isLogo ? "image/png" : "image/jpeg";
  const blob = await shrink(file, isLogo ? 512 : 900, type);
  const path = `${P.bar.id}/${isLogo ? "logo-" : ""}${uuid()}.${isLogo ? "png" : "jpg"}`;
  const { error } = await sb.storage.from("media").upload(path, blob, { contentType: type, upsert: false });
  if (error) throw error;
  return sb.storage.from("media").getPublicUrl(path).data.publicUrl;
}

      const { error } = await sb.rpc("catalog_save_category", { p_token: tok(), p: { id: m.id || null, name: m.name, area: m.area, active: m.active } }); P.busy = false;
      if (error) { m.err = errMsg(error); break; } P.modal = null; await loadMenu(); toast("Categoria salva", ""); return; }
    case "newProd": P.modal = { type: "prod", category_id: v, available: true, multi: false, sizes: [], price: "", image_url: "" }; break;
    case "editProd": { const p = P.prods.find(x => x.id === v); P.modal = { type: "prod", ...p, multi: !!(p.sizes && p.sizes.length), sizes: (p.sizes || []).map(s => ({ l: s.l, v: centsToInput(s.v) })), price: p.price_cents == null ? "" : centsToInput(p.price_cents) }; break; }
    case "saveProd": case "removeProd": {
      if (!String(m.name || "").trim()) { m.err = "Digite o nome."; break; }
      let sizes = null, price = null;
      if (m.multi) { sizes = m.sizes.filter(s => String(s.l).trim() || String(s.v).trim()).map(s => ({ l: String(s.l).trim(), v: parseMoney(s.v) })); if (!sizes.length || sizes.some(s => !s.l || s.v == null)) { m.err = "Preencha nome e preço de cada tamanho."; break; } }
      else { price = String(m.price || "").trim() === "" ? null : parseMoney(m.price); if (String(m.price || "").trim() !== "" && price == null) { m.err = "Preço inválido."; break; } }
      if (a === "removeProd" && !confirm("Tirar " + m.name + " do cardápio? Ele some do garçom e do delivery. Os relatórios antigos continuam.")) return;
      P.busy = true;
      const { error } = await sb.rpc("catalog_save_product", { p_token: tok(), p: { id: m.id || null, category_id: m.category_id, number: String(m.number ?? "").trim() || null, name: m.name, description: m.description || "",
        image_url: m.image_url || "", available: m.available, price_cents: price, sizes, active: a === "removeProd" ? false : true } });
      P.busy = false; if (error) { m.err = errMsg(error); break; }
      P.modal = null; await loadMenu(); toast(a === "removeProd" ? "Produto retirado" : "Produto salvo", m.name); return; }
    case "avail": { const p = P.prods.find(x => x.id === v);
      const { error } = await sb.rpc("catalog_save_product", { p_token: tok(), p: prodPayload(p, { available: !p.available }) });
      if (error) return toast("Não deu certo", errMsg(error), true); await loadMenu(); toast(p.available ? "Marcado como esgotado" : "Disponível de novo", p.name); return; }
    case "newPromo": { const now = new Date(); P.modal = { type: "promo", kind: "happy", weekdays: [1, 2, 3, 4, 5], start_time: "17:00", end_time: "20:00", channel: "todos",
        starts_at: toLocalInput(now), ends_at: toLocalInput(new Date(now.getTime() + 7 * 864e5)) }; break; }
    case "editPromo": { const r = P.promos.find(x => x.id === v); P.modal = { type: "promo", id: r.id, product_id: r.product_id, size_label: r.size_label, price: centsToInput(r.promo_price_cents), label: r.label || "", kind: r.kind,
        weekdays: r.weekdays || [1, 2, 3, 4, 5], start_time: (r.start_time || "17:00").slice(0, 5), end_time: (r.end_time || "20:00").slice(0, 5), channel: r.channel, starts_at: toLocalInput(r.starts_at), ends_at: toLocalInput(r.ends_at) }; break; }
    case "savePromo": {
      const p = P.prods.find(x => x.id === m.product_id); if (!p) { m.err = "Escolha o produto."; break; }
      const price = parseMoney(m.price); if (!price) { m.err = "Digite o preço da promoção."; break; }
      const base = p.sizes && p.sizes.length ? (p.sizes.find(s => s.l === (m.size_label || p.sizes[0].l)) || {}).v : p.price_cents;
      if (base != null && price >= base) { m.err = "O preço da promoção precisa ser menor que o normal (" + money(base) + ")."; break; }
      if (m.kind === "happy" && !m.weekdays.length) { m.err = "Escolha pelo menos um dia."; break; }
      P.busy = true;
      const { error } = await sb.rpc("promo_save", { p_token: tok(), p: { id: m.id || null, product_id: p.id, size_label: p.sizes && p.sizes.length ? (m.size_label || p.sizes[0].l) : null, promo_price_cents: price, label: m.label || "", kind: m.kind,
        weekdays: m.weekdays, start_time: m.start_time, end_time: m.end_time, channel: m.channel,
        starts_at: m.kind === "periodo" && m.starts_at ? new Date(m.starts_at).toISOString() : null, ends_at: m.kind === "periodo" && m.ends_at ? new Date(m.ends_at).toISOString() : null } });
      P.busy = false; if (error) { m.err = errMsg(error); break; }
      P.modal = null; await loadPromos(); toast("Promoção salva", "Ela liga e desliga sozinha no horário"); return; }
    case "promoOff": case "promoOn": { const { error } = await sb.rpc("promo_set_active", { p_token: tok(), p_id: v, p_active: a === "promoOn" }); if (error) throw error; await loadPromos(); toast(a === "promoOn" ? "Promoção reativada" : "Promoção encerrada", ""); return; }
    case "logoOff": { if (!confirm("Remover o logo?")) return; const { error } = await sb.rpc("set_logo", { p_url: "" }); if (error) throw error; await loadBar(); toast("Logo removido", ""); return; }
  }
  } catch (err) { if (P.modal) { P.modal.err = errMsg(err); } else toast("Não deu certo", errMsg(err), true); }
  render();
});
async function loadPromosQuiet() { await loadMenu(); const r = await sb.from("promotions").select("*").order("created_at", { ascending: false }); if (!r.error) { P.promos = r.data; render(); } }
document.addEventListener("keydown", e => { if (!P.mode && P.pick === "manager") { G.key(e, render); return; } if (e.key === "Escape" && P.modal) { P.modal = null; render(); return; } if (e.key === "Enter" && !P.mode && P.pick === "owner") app.querySelector('[data-a="login"]')?.click(); });
document.addEventListener("gesturestart", e => e.preventDefault());
render(); boot().catch(err => toast("Erro ao carregar", errMsg(err), true));
</script>
