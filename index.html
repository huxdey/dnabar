<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0B">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>DNBAR Garçom</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app de celular (moldura 440px no desktop). Noite de bar: fundo tinta escura com brilhos coloridos, cards cheios de cor por estado, folhas de ação vindo de baixo. */
:root{
  --bg:#F5F3FA; --surface:#FFFFFF; --surface-2:#EEEBF5; --line:#E2DDEC;
  --fg:#16121F; --muted:#6E6680; --ink-on-color:#FFFFFF; --ink-on-light:#16121F;
  --g1:#FF3D55; --g2:#FF8A3D; --brand:#F0364E;
  --ok:#10B981; --ok-2:#34E3A4; --warn:#F5A300; --warn-2:#FFD35C; --bill:#3E6BFF; --bill-2:#7C9CFF; --violet:#9B5CF6;
  --glow1:rgba(255,61,85,.10); --glow2:rgba(91,140,255,.10);
  --shadow:0 10px 30px rgba(40,20,70,.12); --shadow-c:0 10px 26px -8px;
  --display:"Sora","Segoe UI",system-ui,sans-serif;
  --body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:20px; --accent:#111318; --on-accent:#fff; --accent-text:#111318; --hero-bg:#111318; --hero-fg:#fff; --shadow-btn:0 6px 16px -6px rgba(0,0,0,.35);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C0A12; --surface:#17141F; --surface-2:#221E2D; --line:#2D2839;
  --fg:#F8F5FF; --muted:#A39BB6; --brand:#FF4D63;
  --ok:#22D38F; --warn:#FFB224; --bill:#5B8CFF;
  --glow1:rgba(255,61,85,.20); --glow2:rgba(91,140,255,.18);
  --shadow:0 12px 34px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C0A12; --surface:#17141F; --surface-2:#221E2D; --line:#2D2839;
  --fg:#F8F5FF; --muted:#A39BB6; --brand:#FF4D63;
  --ok:#22D38F; --warn:#FFB224; --bill:#5B8CFF;
  --glow1:rgba(255,61,85,.20); --glow2:rgba(91,140,255,.18);
  --shadow:0 12px 34px rgba(0,0,0,.55); color-scheme:dark}

/* Três fundos à escolha do bar. Paleta profissional: neutros do próprio fundo, um destaque para ações e cor só onde há estado (verde pronto, âmbar atenção, azul/violeta conta). */
html:root[data-tema="preto"]{
  --bg:#0A0A0B; --surface:#141416; --surface-2:#1E1E21; --line:#2A2A2E; --fg:#F4F4F5; --muted:#9A9AA2;
  --accent:#F4F4F5; --on-accent:#0A0A0B; --accent-text:#F4F4F5; --brand:#F4F4F5; --hero-bg:#1E1E21; --hero-fg:#F4F4F5;
  --ok:#22C47F; --ok-2:#22C47F; --warn:#F5B000; --warn-2:#F5B000; --bill:#3B82F6; --bill-2:#3B82F6; --violet:#3B82F6;
  --glow1:transparent; --glow2:transparent; --shadow-btn:0 6px 18px -6px rgba(0,0,0,.6);
  --shadow:0 10px 30px rgba(0,0,0,.55); --scrim:rgba(0,0,0,.6); color-scheme:dark}
html:root[data-tema="branco"]{
  --bg:#F5F6F8; --surface:#FFFFFF; --surface-2:#EEF0F3; --line:#E1E4E9; --fg:#111318; --muted:#5F6672;
  --accent:#111318; --on-accent:#FFFFFF; --accent-text:#111318; --brand:#111318; --hero-bg:#111318; --hero-fg:#FFFFFF;
  --ok:#16A34A; --ok-2:#16A34A; --warn:#F59E0B; --warn-2:#F59E0B; --warn-ink:#9A5B00; --bill:#2563EB; --bill-2:#2563EB; --violet:#2563EB;
  --glow1:transparent; --glow2:transparent; --shadow-btn:0 6px 16px -6px rgba(17,19,24,.35);
  --shadow:0 8px 24px rgba(17,19,24,.08); --scrim:rgba(17,19,24,.45); color-scheme:light}
html:root[data-tema="azul"]{
  --bg:#081428; --surface:#0F1F3B; --surface-2:#172B4D; --line:#22385F; --fg:#EDF3FF; --muted:#90A4C8;
  --accent:#3B82F6; --on-accent:#FFFFFF; --accent-text:#7FB0FF; --brand:#7FB0FF; --hero-bg:#1D4ED8; --hero-fg:#FFFFFF;
  --ok:#22C47F; --ok-2:#22C47F; --warn:#F5B000; --warn-2:#F5B000; --bill:#8B7CF6; --bill-2:#8B7CF6; --violet:#8B7CF6;
  --glow1:transparent; --glow2:transparent; --shadow-btn:0 6px 18px -6px rgba(59,130,246,.55);
  --shadow:0 10px 30px rgba(0,4,16,.55); --scrim:rgba(1,6,18,.62); color-scheme:dark}
.tema{display:flex;gap:2px;padding:3px;border-radius:999px;background:var(--surface);border:1px solid var(--line);flex:none}
.tema button{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:2px solid transparent}
.tema button span{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(128,128,128,.55)}
.tema button[aria-pressed="true"]{border-color:var(--brand)}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;transition:transform .12s ease}
button:active{transform:scale(.96)}
button:focus-visible,input:focus-visible{outline:3px solid var(--bill);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
#app{max-width:440px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden;
  background:radial-gradient(420px 300px at 110% -5%,var(--glow1),transparent 70%),radial-gradient(380px 300px at -20% 35%,var(--glow2),transparent 70%),var(--bg)}
@media (min-width:600px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.view{flex:1;display:flex;flex-direction:column;min-height:0}
.view.enter{animation:enter .32s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.scroll{flex:1;overflow-y:auto;padding:0 16px 28px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.02em}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.grad-text{color:var(--accent-text)}
svg{width:22px;height:22px;flex:none}

/* avatar */
.ph{border-radius:50%;object-fit:cover;display:block;flex:none;background:var(--surface-2)}
.ring{padding:3px;border-radius:50%;background:var(--line);position:relative;flex:none}
.ring .ph{border:3px solid var(--bg)}
.ring .on{position:absolute;right:2px;bottom:2px;width:14px;height:14px;border-radius:50%;background:var(--ok);border:3px solid var(--bg)}

/* top */
.top{display:flex;align-items:center;gap:12px;padding:16px 16px 12px}
.top h1{font-size:26px;font-weight:800;line-height:1.05}
.top .sub{color:var(--muted);font-size:14px;margin-top:4px;font-weight:500}
.top .grow{flex:1;min-width:0}
.back{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none;box-shadow:var(--shadow)}

/* nav */
.nav{margin:0 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;padding:6px;border-radius:24px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.nav button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:18px;font-size:14px;font-weight:700;color:var(--muted);position:relative}
.nav button[aria-current="true"]{background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow-btn)}
.nav .dot{min-width:20px;height:20px;border-radius:10px;background:var(--warn-2);color:#1a1200;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px;animation:pop .4s}
.nav button:not([aria-current="true"]) .dot{background:var(--warn);color:#1a1200}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.2)}100%{transform:scale(1)}}

/* login */
.login{flex:1;display:flex;flex-direction:column;padding:26px 16px 22px;gap:20px;overflow-y:auto}
.brandmark{font-family:var(--display);font-weight:800;font-size:38px;line-height:1.02;letter-spacing:-.03em}
.people{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.person{position:relative;border-radius:24px;overflow:hidden;aspect-ratio:3/4;max-width:100%;text-align:left;box-shadow:var(--shadow);background:var(--surface-2)}
.person img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
.person:hover img{transform:scale(1.05)}
.person::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(8,4,14,.85))}
.person .cap{position:absolute;left:12px;right:12px;bottom:12px;z-index:1;color:#fff}
.person .cap b{display:block;font-family:var(--display);font-size:20px;font-weight:700}
.person .role{display:inline-block;margin-top:4px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:8px;color:#fff;background:rgba(255,255,255,.2);backdrop-filter:blur(4px)}
.people .person:nth-child(odd){animation:rise .5s both}
.people .person:nth-child(even){animation:rise .5s .08s both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.pin-dots{display:flex;gap:16px;justify-content:center;margin:4px 0}
.pin-dots i{width:16px;height:16px;border-radius:50%;background:var(--surface-2);border:2px solid var(--line);transition:.15s}
.pin-dots i.on{background:var(--accent);border-color:transparent;transform:scale(1.15)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:64px;border-radius:20px;background:var(--surface);border:1px solid var(--line);font-family:var(--display);font-size:26px;font-weight:600}
.pad button.ghost{background:none;border:0;font-family:var(--body);font-size:15px;font-weight:600;color:var(--muted);display:grid;place-items:center}
.spin{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pin-av{position:relative;width:118px;height:118px;margin:0 auto}
.pin-av .spin{position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--accent-text),transparent 70%)}
.pin-av img{position:absolute;inset:5px;width:108px;height:108px;border-radius:50%;object-fit:cover;border:4px solid var(--bg)}

/* home */
.stats{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 16px;padding:0 16px;scrollbar-width:none}
.stats::-webkit-scrollbar{display:none}
.stat{flex:none;padding:12px 14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);min-width:118px}
.stat b{display:block;font-family:var(--display);font-size:22px;font-weight:700}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.stat.hot{background:var(--accent);border:0;color:var(--on-accent)}
.stat.hot span{color:color-mix(in srgb,var(--on-accent) 72%,transparent)}
.queue{display:flex;flex-direction:column;gap:12px}
.alert{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border-radius:var(--r);padding:12px;position:relative;overflow:hidden;animation:rise .4s both}
.alert::before{content:"";position:absolute;right:-40px;top:-50px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.14)}
.alert .mesa-n{width:58px;height:58px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:24px;line-height:1;background:rgba(255,255,255,.22);backdrop-filter:blur(4px);position:relative}
.alert .mesa-n small{font-size:9px;letter-spacing:.14em;font-weight:700;opacity:.85;font-family:var(--body)}
.alert .what{min-width:0;text-align:left;position:relative}
.alert .what b{display:block;font-family:var(--display);font-size:17px;font-weight:700}
.alert .what span{display:block;font-size:13px;font-weight:500;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alert .act{position:relative;height:44px;padding:0 16px;border-radius:14px;background:rgba(255,255,255,.95);font-weight:800;font-size:14px;white-space:nowrap}
.t-pronto{background:var(--ok);color:#05281a;box-shadow:var(--shadow-c) color-mix(in srgb,var(--ok) 28%,transparent)}
.t-pronto .act{color:#067a50}
.t-chamou{background:var(--warn);color:#2b1b00;box-shadow:var(--shadow-c) color-mix(in srgb,var(--warn) 28%,transparent)}
.t-chamou .act{color:#8a5a00}
.t-chamou .mesa-n{animation:ring 1.6s ease-in-out infinite}
@keyframes ring{0%,100%{transform:rotate(0)}10%{transform:rotate(-8deg)}20%{transform:rotate(8deg)}30%{transform:rotate(-5deg)}40%{transform:rotate(0)}}
.t-conta{background:var(--bill);color:#fff;box-shadow:var(--shadow-c) color-mix(in srgb,var(--bill) 28%,transparent)}
.t-conta .act{color:var(--bill)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:16px;font-weight:800;font-size:15px;background:var(--surface-2);white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow-btn)}
.btn.ok{background:var(--ok);color:#05281a}
.btn.block{width:100%;min-height:58px;font-size:17px;border-radius:20px}
.btn:disabled{opacity:.5;cursor:default;box-shadow:none}
.big-actions{display:grid;grid-template-columns:1.15fr 1fr;gap:10px;margin-top:16px}
.big-actions .btn{min-height:84px;flex-direction:column;gap:6px;font-family:var(--display);font-size:16px;font-weight:700;border-radius:var(--r);white-space:normal;text-align:center}
.big-actions .btn.sec{background:var(--surface);border:1px solid var(--line)}
.big-actions .btn.sec svg{color:var(--bill)}
.empty{padding:24px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);font-weight:500}
.section-h{display:flex;justify-content:space-between;align-items:baseline;margin:24px 0 10px}
.section-h h3{font-size:19px;font-weight:700}
.minis{display:flex;flex-direction:column;gap:8px}
.mini{display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;background:var(--surface);border:1px solid var(--line);border-radius:18px;text-align:left;width:100%}
.mini .n{font-family:var(--display);font-weight:800;font-size:18px;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--surface-2);flex:none}
.mini .n.pronto{background:var(--ok);color:#05281a}
.mini .n.chamou{background:var(--warn);color:#2b1b00}
.mini .n.conta{background:var(--bill);color:#fff}
.mini .grow{flex:1;min-width:0;font-size:13px;color:var(--muted);font-weight:500}
.mini .grow b{display:block;color:var(--fg);font-size:15px;font-weight:700}
.mini .v{font-weight:800}

/* salão */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 12px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:40px;padding:0 15px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:7px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .c{font-size:11px;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);padding:0 5px}
.chip[aria-pressed="true"] .c{background:var(--bg);color:var(--fg)}
.chip .sw{width:10px;height:10px;border-radius:50%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);font-weight:600;margin:0 0 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.area-h{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:16px;margin:16px 0 10px}
.area-h span{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:600}
.tables{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tbl{aspect-ratio:1/1;max-width:100%;border-radius:20px;padding:11px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;background:var(--surface);border:1px solid var(--line);position:relative;overflow:hidden}
.tbl .n{font-family:var(--display);font-weight:800;font-size:28px;line-height:1}
.tbl .s{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.tbl .v{font-size:13px;font-weight:700}
.tbl .who{position:absolute;top:9px;right:9px;width:28px;height:28px;border-radius:50%;object-fit:cover;border:2px solid var(--surface)}
.tbl.livre{background:transparent;border:1.5px dashed var(--line)}
.tbl.livre .n,.tbl.livre .s{color:var(--muted)}
.tbl.livre .v{color:var(--muted);font-weight:500;font-size:12px}
.tbl.ocupada .s{color:var(--brand)}
.tbl.pronto{background:var(--ok);border:0;color:#05281a;box-shadow:var(--shadow-c) color-mix(in srgb,var(--ok) 28%,transparent)}
.tbl.chamou{background:var(--warn);border:0;color:#2b1b00;box-shadow:var(--shadow-c) color-mix(in srgb,var(--warn) 28%,transparent);animation:breathe 1.8s ease-in-out infinite}
.tbl.conta{background:var(--bill);border:0;color:#fff;box-shadow:var(--shadow-c) color-mix(in srgb,var(--bill) 28%,transparent)}
.tbl.pronto .who,.tbl.chamou .who,.tbl.conta .who{border-color:rgba(255,255,255,.7)}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}

/* mesa */
.hero{border-radius:26px;padding:18px;color:var(--hero-fg);position:relative;overflow:hidden;background:var(--hero-bg);box-shadow:var(--shadow);margin-bottom:14px}
.hero.pronto{background:var(--ok);box-shadow:var(--shadow-c) color-mix(in srgb,var(--ok) 28%,transparent)}
.hero.chamou{background:var(--warn);color:#2b1b00}
.hero.conta{color:#fff;background:var(--bill);box-shadow:var(--shadow-c) color-mix(in srgb,var(--bill) 28%,transparent)}
.hero::before{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.14)}
.hero::after{content:"";position:absolute;right:40px;bottom:-90px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.09)}
.hero-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;position:relative;z-index:1}
.hero .st-pill{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;border-radius:10px;background:rgba(255,255,255,.22)}
.hero .big{font-family:var(--display);font-weight:800;font-size:72px;line-height:.9;letter-spacing:-.04em;margin-top:10px}
.hero .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;font-weight:600;opacity:.92;margin-top:6px}
.hero .waiter{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700}
.hero .waiter img{width:54px;height:54px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,.85)}
.hero .code{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding:10px 14px;border-radius:16px;background:rgba(0,0,0,.18);backdrop-filter:blur(6px)}
.hero .code b{font-family:var(--display);font-size:26px;letter-spacing:.28em;font-weight:700}
.hero .code span{font-size:12px;font-weight:600;opacity:.9;max-width:18ch;text-align:right}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.acts button{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 2px;border-radius:18px;background:var(--surface);border:1px solid var(--line);font-size:12px;font-weight:700}
.acts .ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:#fff}
.acts .i1{background:var(--accent);color:var(--on-accent)}
.acts .i2{background:var(--surface-2);color:var(--fg)}
.acts .i3{background:var(--surface-2);color:var(--fg)}
.acts .i4{background:var(--bill)}
.bill{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.line{display:grid;grid-template-columns:34px 1fr auto;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:start}

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm";
/* ================= CONEXÃO (chave pública: pode ficar no app) ================= */

/* ================= DADOS DO BAR (carregados do banco) ================= */
let BAR = { name:"DNBAR", serviceFee:0.10, kitchen:false };

 flame:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c4 0 7-3 7-7 0-5-5-7-5-12-3 2-4 5-4 7-1-1-2-2-2-4-2 2-3 5-3 9 0 4 3 7 7 7z"/></svg>',
 glass:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12l-1.5 17a1 1 0 01-1 1h-7a1 1 0 01-1-1z"/><path d="M6.5 8h11"/></svg>',
 bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1112 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 004 0"/></svg>',
 cup:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 8h12v6a6 6 0 01-12 0zM17 10h2a2 2 0 010 4h-2"/></svg>',
 plate:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/></svg>',
 lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>',
 del:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h11v14H9l-6-7z"/><path d="M12 9l5 6M17 9l-5 6"/></svg>',
 out:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h11"/></svg>'
};

/* ================= DADOS ================= */
let PROD = {}; // pid -> produto
let ALL = [];
const money = c => "R$ "+(c/100).toFixed(2).replace(".",",").replace(/\B(?=(\d{3})+(?!\d))/g,".");
const hhmm = ts => new Date(ts).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
const now = () => hhmm(Date.now());
const esc = s => String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : "10000000-1000-4000-8000-100000000000".replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16)));

function buildMenu(cats, prods){
  MENU = cats.map(c=>({id:c.slug, dbid:c.id, hue:c.hue, name:c.name, area:c.area,
    items: prods.filter(p=>p.category_id===c.id).map(p=>({id:p.id, n:p.number, img:p.image_url, icon:p.icon, name:p.name,
      price:p.price_cents, prices:(p.sizes&&p.sizes.length?p.sizes:null), available:p.available}))}));
  PROD = {};
  MENU.forEach(c=>c.items.forEach(it=>{
    it.cat=c.id; it.area=c.area; it.hue=c.hue;
    if(it.prices) it.prices.forEach(p=>{PROD[it.n+"-"+p.l[0]]={pid:it.n+"-"+p.l[0],id:it.id,size:p.l,n:it.n,name:it.name+" ("+p.l.toLowerCase()+")",price:p.v,area:c.area,base:it}});
    else PROD[String(it.n)]={pid:String(it.n),id:it.id,size:null,n:it.n,name:it.name,price:it.price,area:c.area,base:it};
  }));
  ALL = MENU.flatMap(c=>c.items);
}

/* ================= ESTADO ================= */
const S = {user:null,token:null,pinFor:null,pin:"",pinErr:"",pinBusy:false,view:"inicio",mesa:null,cart:[],cat:"top",q:"",filter:"todas",sheet:null,toast:null,sending:false,lastOrder:{},
  auth:null, loaded:false, act:{email:"",pw:"",err:"",busy:false}, queue:[]};
let TABLES = [];
const T = id => TABLES.find(t=>t.id===id);
const me = () => STAFF.find(p=>p.id===S.user);
const sub = s => s.items.filter(i=>i.st!=="cancelado").reduce((a,i)=>a+i.qty*(i.price||0),0);
const billOf = s => { const st=sub(s), fee=s.feeOn===false?0:Math.round(st*BAR.serviceFee), total=Math.max(0,st+fee-(s.discount||0)); return {sub:st,fee,total,paid:s.paid||0,rem:Math.max(0,total-(s.paid||0))}; };
function tState(t){
  if(!t.s) return "livre";
  if(t.s.flag==="chamou") return "chamou";
  if(t.s.flag==="conta") return "conta";
  if(t.s.items.some(i=>i.st==="pronto")) return "pronto";
  return "ocupada";
}
const LABEL = {livre:"Livre",ocupada:"Ocupada",pronto:"Pedido pronto",chamou:"Chamando",conta:"Pediu a conta"};
function alerts(){
  const out=[];
  TABLES.forEach(t=>{ if(!t.s || t.s.waiter!==S.user) return;
    const pr=t.s.items.filter(i=>i.st==="pronto");
    if(t.s.flag==="chamou") out.push({t,kind:"chamou",title:"Chamou o garçom",txt:"Pelo QR às "+t.s.flagAt,w:0});
    if(pr.length) out.push({t,kind:"pronto",title:"Pedido pronto",txt:pr.map(i=>i.qty+" "+i.name).join(", "),w:1});
    if(t.s.flag==="conta") out.push({t,kind:"conta",title:"Pediu a conta",txt:money(billOf(t.s).rem)+" a pagar",w:2});
  });
  return out.sort((a,b)=>a.w-b.w);
}

/* ================= BANCO DE DADOS ================= */
const ERR = {
  SESSAO_EXPIRADA:"Sua sessão expirou. Entre de novo com o PIN.", MESA_OCUPADA:"Essa mesa já está aberta.",
  MESA_FECHADA:"Essa mesa já foi fechada.", MESA_INVALIDA:"Mesa não encontrada.", PEDIDO_VAZIO:"O pedido está vazio.",
  PRODUTO_INVALIDO:"Um produto do pedido não existe mais.", PRODUTO_ESGOTADO:"Produto esgotado", SEM_PRECO:"Produto sem preço",
  TAMANHO_INVALIDO:"Escolha o tamanho de novo", QUANTIDADE_INVALIDA:"Quantidade inválida.",
  PIN_INVALIDO:"PIN incorreto.", BLOQUEADO:"Muitas tentativas. Aguarde 5 minutos ou chame o gerente.",
  APARELHO_NAO_AUTORIZADO:"Este aparelho não está autorizado.", CAIXA_FECHADO:"O caixa está fechado.", SEM_PERMISSAO:"Sua função não permite isso.", VALOR_INVALIDO:"Valor inválido."
};
const errMsg = e => { const m=String((e&&e.message)||e||""); const [code,extra]=m.split(":"); return ERR[code]?(ERR[code]+(extra?": "+extra:"")):"Algo deu errado. Tente de novo."; };
const isNetErr = e => !navigator.onLine || /fetch|network|Load failed|timeout/i.test(String((e&&e.message)||e||""));

async function rpc(fn, args){
  const {data,error} = await sb.rpc(fn, args);
  if(error){
    if(/SESSAO_EXPIRADA/.test(error.message)) kickOut();
    throw error;
  }
  return data;
}
function kickOut(){
  S.user=null; S.token=null; S.view="inicio"; S.sheet=null;
  try{localStorage.removeItem("dnbar-staff")}catch(e){}
  toast("Sessão encerrada","Entre de novo com o seu PIN");
}

async function loadStatic(){
  const [est, st, tb, ca, pr] = await Promise.all([
    sb.from("establishments").select("id,name,service_fee_pct,kitchen_enabled").single(),
    sb.from("staff").select("id,name,role,role_label,photo_url,portrait_url").eq("active",true).order("sort"),
    sb.from("dining_tables").select("id,label,area,sort").eq("active",true).order("sort"),
    sb.from("categories").select("id,slug,name,hue,area,sort").eq("active",true).order("sort"),
    sb.from("products").select("id,category_id,number,name,image_url,icon,price_cents,sizes,available,sort").eq("active",true).order("sort")
  ]);
  for(const r of [est,st,tb,ca,pr]) if(r.error) throw r.error;
  BAR = { name:est.data.name, serviceFee:Number(est.data.service_fee_pct)/100, kitchen:est.data.kitchen_enabled };
  STAFF = st.data.filter(p=>p.role==="garcom"||p.role==="gerente").map(p=>({id:p.id,name:p.name,role:p.role_label,photo:p.photo_url||"img/avatar.png",portrait:p.portrait_url||p.photo_url||"img/avatar.png"}));
  buildMenu(ca.data, pr.data);
  TABLES = tb.data.map(t=>({id:t.label, dbid:t.id, area:t.area, s:null}));
}

async function loadLive(){
  const ses = await sb.from("table_sessions").select("id,table_id,waiter_id,people,flag,flag_at,opened_at,service_fee_on,discount_cents").eq("status","open");
  if(ses.error) throw ses.error;
  const ids = ses.data.map(x=>x.id);
  let items=[], evs=[], pays=[];
  if(ids.length){
    const [it, ev, pa] = await Promise.all([
      sb.from("order_items").select("id,session_id,product_id,size_label,name_snapshot,unit_price_cents,qty,note,area,status,created_at,orders(number)").in("session_id",ids).order("created_at"),
      sb.from("session_events").select("session_id,message,created_at").in("session_id",ids).order("id"),
      sb.from("payments").select("session_id,amount_cents").in("session_id",ids)
    ]);
    if(it.error) throw it.error; if(ev.error) throw ev.error; if(pa.error) throw pa.error;
    items=it.data; evs=ev.data; pays=pa.data;
  }
  const byNum = {}; ALL.forEach(b=>byNum[b.id]=b);
  TABLES.forEach(t=>t.s=null);
  ses.data.forEach(x=>{
    const t = TABLES.find(t=>t.dbid===x.table_id); if(!t) return;
    t.s = {sid:x.id, opened:hhmm(x.opened_at), waiter:x.waiter_id, people:x.people, flag:x.flag, flagAt:x.flag_at?hhmm(x.flag_at):"",
      feeOn:x.service_fee_on, discount:x.discount_cents||0, paid:pays.filter(p=>p.session_id===x.id).reduce((a,p)=>a+p.amount_cents,0),
      items: items.filter(i=>i.session_id===x.id).map(i=>{const b=byNum[i.product_id]; const pid=b?(b.n+(i.size_label?"-"+i.size_label[0]:"")):"x";
        return {pid, name:i.name_snapshot, price:i.unit_price_cents, area:i.area, qty:i.qty, st:i.status, note:i.note||"", order:i.orders?i.orders.number:null}}),
      log: evs.filter(e=>e.session_id===x.id).map(e=>[hhmm(e.created_at), e.message])};
  });
}

let liveTimer=null, channel=null;
function scheduleLive(){ clearTimeout(liveTimer); liveTimer=setTimeout(async()=>{ try{ await loadLive(); render(); }catch(e){} }, 250); }
function subscribe(){
  if(channel) sb.removeChannel(channel);
  channel = sb.channel("salao")
    .on("postgres_changes",{event:"*",schema:"public",table:"table_sessions"},scheduleLive)
    .on("postgres_changes",{event:"*",schema:"public",table:"order_items"},ev=>{
      if(ev.eventType==="UPDATE" && ev.new && ev.new.status==="pronto" && ev.old && ev.old.status!=="pronto") S.readyPing=true;
      scheduleLive();})
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"session_events"},scheduleLive)
    .on("postgres_changes",{event:"*",schema:"public",table:"payments"},scheduleLive)
    .on("postgres_changes",{event:"*",schema:"public",table:"products"},async()=>{ try{ await loadStatic(); await loadLive(); render(); }catch(e){} })
    .subscribe();
}

/* ===== fila offline: pedido nunca se perde, nunca duplica (mesma chave) ===== */
function saveQueue(){ try{localStorage.setItem("dnbar-fila",JSON.stringify(S.queue))}catch(e){} }
function loadQueue(){ try{S.queue=JSON.parse(localStorage.getItem("dnbar-fila")||"[]")}catch(e){S.queue=[]} }
let flushing=false;
async function flushQueue(){
  if(flushing||!S.queue.length||!S.token) return; flushing=true;
  try{
    while(S.queue.length){
      const q=S.queue[0];
      try{
        const r = await rpc("create_order",{p_token:S.token,p_session_id:q.sid,p_key:q.key,p_items:q.items});
        S.queue.shift(); saveQueue();
        if(q.late) toast(`Mesa ${q.label}: pedido #${r.number} enviado`,"Saiu da fila de espera");
        if(q.onDone) q.onDone(r);
      }catch(e){
        if(isNetErr(e)) break;
        S.queue.shift(); saveQueue(); toast(`Mesa ${q.label}: pedido não enviado`, errMsg(e));
        if(q.onFail) q.onFail(e);
      }
    }
  } finally { flushing=false; render(); }
}
window.addEventListener("online",()=>{render(); flushQueue(); scheduleLive();});
window.addEventListener("offline",()=>render());
setInterval(()=>{ flushQueue(); },5000);
setInterval(()=>{ if(S.auth&&S.loaded) scheduleLive(); },30000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden&&S.auth&&S.loaded){ scheduleLive(); flushQueue(); } });

async function boot(){
  loadQueue();
  const {data} = await sb.auth.getSession();
  S.auth = data.session;
  if(S.auth){
    try{
      await loadStatic(); await loadLive(); S.loaded=true; subscribe();
      try{ const st=JSON.parse(localStorage.getItem("dnbar-staff")||"null"); if(st&&STAFF.some(p=>p.id===st.id)){S.user=st.id;S.token=st.token} }catch(e){}
      flushQueue();
    }catch(e){ S.bootErr = isNetErr(e) ? "Sem conexão com a internet. Tentando de novo..." : "Não foi possível carregar os dados do bar."; setTimeout(boot,5000); }
  }
  render();
}

const app = document.getElementById("app");
const staff = id => STAFF.find(p=>p.id===id);
function render(){
  let h="";
  const key=!S.auth?"act":!S.user?(S.pinFor?"pin":"login"):S.view+(S.view==="mesa"||S.view==="pedido"?S.mesa:"");
  const enter=render.k!==key;
  let inner;
  if(!S.auth) inner=vActivate();
  else if(!S.loaded) inner=`<div class="loading">${esc(S.bootErr||"Carregando o salão...")}</div>`;
  else if(!S.user) inner=vLogin();
  else if(S.view==="mesa") inner=vMesa();
  else if(S.view==="pedido") inner=vPedido();
  else inner=(S.view==="salao"?vSalao():vInicio());
  h=`<div class="view ${enter?"enter":""}">${inner}</div>`;
  if(S.user&&(S.view==="inicio"||S.view==="salao")) h+=vNav();
  if(S.auth&&(!navigator.onLine||S.queue.length)) h+=`<div class="net" role="status">${!navigator.onLine?"Sem conexão":"Enviando"}${S.queue.length?` · ${S.queue.length} ${S.queue.length>1?"pedidos aguardando":"pedido aguardando"}`:""}</div>`;
  if(S.sheet) h+=`<div class="scrim" data-a="close"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${S.sheet()}</div>`;
  if(S.toast) h+=`<div class="toast" role="status"><div class="ic">${I.check}</div><div><b>${esc(S.toast.t)}</b><span>${esc(S.toast.s)}</span></div></div>`;
  const sc=app.querySelector(".scroll"); const y=sc?sc.scrollTop:0;
  const focused=document.activeElement&&document.activeElement.id;
  app.innerHTML=h;
  const sc2=app.querySelector(".scroll"); if(sc2&&!enter) sc2.scrollTop=y;
  render.k=key;
  if(focused==="q"){const q=document.getElementById("q"); if(q){q.focus(); q.setSelectionRange(q.value.length,q.value.length)}}
  if(S.readyPing&&S.user){S.readyPing=false; beep();}
  if(S.bump){const c=app.querySelector(".cartbar .btn"); if(c) c.classList.add("bump"); S.bump=false}
}

function beep(){ try{ const c=new (window.AudioContext||window.webkitAudioContext)(); const o=c.createOscillator(), g=c.createGain(); o.connect(g); g.connect(c.destination); o.frequency.value=880; g.gain.setValueAtTime(.2,c.currentTime); g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.4); o.start(); o.stop(c.currentTime+.4); if(navigator.vibrate) navigator.vibrate(200);}catch(e){} }

function confetti(){
  const cols=["var(--ok)","var(--fg)","var(--muted)","var(--ok)"];
  let h='<div class="confetti" aria-hidden="true">';
  for(let i=0;i<26;i++){const a=Math.random()*Math.PI*2, d=70+Math.random()*90;
    h+=`<i style="background:${cols[i%cols.length]};--x:${Math.cos(a)*d|0}px;--y:${(Math.sin(a)*d-30)|0}px;--r:${Math.random()*540|0}deg;animation-delay:${Math.random()*80|0}ms"></i>`}
  return h+"</div>";
}

    <div class="notes">${NOTES[p.area].map(n=>`<button class="note" data-a="note" data-v="${ix}" data-n="${n}" aria-pressed="${c.notes.includes(n)}">${n}</button>`).join("")}</div></div>`}).join("")}
   <div class="route">${k?`<span class="k">${I.flame}${k} para a cozinha</span>`:""}${b?`<span class="b">${I.glass}${b} para o bar</span>`:""}</div>

function shTransfer(){

const lastRound=t=>(S.lastOrder[t.id]||t.s.items.filter(i=>i.area==="bar"&&i.st!=="cancelado").map(i=>({pid:i.pid,qty:i.qty}))).filter(c=>PROD[c.pid]);

   <div class="meta"><span>${money(B.sub)} + serviço ${money(B.fee)}${s.discount?` - desconto ${money(s.discount)}`:""}${B.paid?` · já pago ${money(B.paid)}`:""}</span></div></div></div>

   ${pend?`<div class="empty" style="text-align:left;border-style:solid">Ainda tem item em preparo ou para entregar.</div>`:""}
   <div class="eyebrow">Recebeu na maquininha? Toque na forma de pagamento</div>
   <div class="pick" style="grid-template-columns:repeat(4,1fr)">${M.map(([k,l])=>`<button data-a="payAll" data-v="${k}" ${S.busy||!B.rem?"disabled":""}>${l}</button>`).join("")}</div>
  </div><div class="sh-f"><button class="btn primary block" data-a="toCashier">${I.bell}Mandar para o caixa</button></div>`;

/* ================= AÇÕES ================= */
function toast(t,s){S.toast={t,s};render();clearTimeout(toast.h);toast.h=setTimeout(()=>{S.toast=null;render()},3200)}
function openMesa(id){S.mesa=id;S.view="mesa";S.sheet=null}
function addToCart(pid){
  const ix=S.cart.findIndex(c=>c.pid===pid);
  if(ix>-1) S.cart[ix].qty++; else S.cart.push({pid,qty:1,notes:[]});
  S.bump=true;
}
async function act(fn, args, okTitle, okSub){
  try{ await rpc(fn, Object.assign({p_token:S.token}, args)); await loadLive(); if(okTitle) toast(okTitle, okSub||""); else render(); return true; }
  catch(e){ toast("Não deu certo", isNetErr(e)?"Sem conexão. Tente de novo em instantes.":errMsg(e)); return false; }
}
async function doPinLogin(){
  const id=S.pinFor, pin=S.pin; S.pinBusy=true; S.pinErr=""; render();
  try{
    const r = await rpc("staff_login",{p_staff_id:id,p_pin:pin});
    if(r.ok){ S.user=id; S.token=r.token; S.pinFor=null; S.view="inicio"; try{localStorage.setItem("dnbar-staff",JSON.stringify({id,token:r.token}))}catch(e){} flushQueue(); }
    else S.pinErr = ERR[r.error] + (r.error==="PIN_INVALIDO"&&r.left!=null?` Restam ${r.left} tentativas.`:"");
  }catch(e){ S.pinErr = isNetErr(e)?"Sem conexão. Tente de novo.":errMsg(e); }
  S.pin=""; S.pinBusy=false; render();
}
function sendOrder(){
  if(S.sending) return; S.sending=true; render();
  const t=T(S.mesa);
  const items=S.cart.map(c=>{const p=PROD[c.pid]; return {product_id:p.id,size:p.size,qty:c.qty,note:c.notes.join(", ")}});
  let k=0,b=0; S.cart.forEach(c=>{PROD[c.pid].area==="bar"?b+=c.qty:k+=c.qty});
  const bar=S.cart.filter(c=>PROD[c.pid].area==="bar").map(c=>({pid:c.pid,qty:c.qty}));
  const q={key:uuid(), sid:t.s.sid, label:t.id, items};
  q.onDone=async r=>{ if(bar.length) S.lastOrder[t.id]=bar; S.cart=[]; S.q=""; S.sending=false; S.sent={no:r.number,k,b}; await loadLive().catch(()=>{}); render(); };
  q.onFail=()=>{ S.sending=false; };
  S.queue.push(q); saveQueue();
  flushQueue().then(()=>{
    if(S.sending && S.queue.includes(q)){ // ficou na fila por falta de conexão
      q.late=true; delete q.onDone; delete q.onFail; saveQueue();
      if(bar.length) S.lastOrder[t.id]=bar; S.cart=[]; S.q=""; S.sending=false; S.sheet=null; S.view="mesa";
      toast("Sem conexão: pedido guardado","Ele sai sozinho quando a internet voltar");
    }
  });
}

app.addEventListener("input",e=>{const k=e.target.dataset.in; if(k==="q"){S.q=e.target.value;render()} else if(k==="email"||k==="pw"){S.act[k]=e.target.value}});
app.addEventListener("keydown",e=>{ if(e.key==="Enter"&&(e.target.dataset.in==="email"||e.target.dataset.in==="pw")){ e.preventDefault(); app.querySelector('[data-a="activate"]').click(); } });
app.addEventListener("click",async e=>{
  const el=e.target.closest("[data-a]"); if(!el) return;
  const a=el.dataset.a, v=el.dataset.v;
  switch(a){
   case "tema": TEMA=v; try{localStorage.setItem("dnbar-tema",v)}catch(e){} aplicaTema(); break;
   case "activate": {
     if(S.act.busy) return; S.act.busy=true; S.act.err=""; render();
     const {data,error}=await sb.auth.signInWithPassword({email:S.act.email.trim(),password:S.act.pw});
     S.act.busy=false;
     if(error){ S.act.err = isNetErr(error)?"Sem conexão com a internet.":"E-mail ou senha incorretos."; render(); return; }
     S.auth=data.session; S.act={email:"",pw:"",err:"",busy:false}; S.loaded=false; render(); boot(); return; }
   case "deactivate": if(!confirm("Desativar este aparelho? Vai precisar do e-mail e senha do bar para ativar de novo.")) return;
     await sb.auth.signOut(); try{localStorage.removeItem("dnbar-staff")}catch(e){} S.auth=null; S.loaded=false; S.user=null; break;
   case "who": S.pinFor=v; S.pin=""; S.pinErr=""; break;
   case "pinback": S.pinFor=null; S.pin=""; S.pinErr=""; break;
   case "pindel": S.pin=S.pin.slice(0,-1); break;
   case "pin": if(S.pinBusy) return; S.pin+=v; S.pinErr=""; if(S.pin.length===4){ doPinLogin(); return; } break;
   case "logout": { const tk=S.token; S.user=null; S.token=null; S.view="inicio"; try{localStorage.removeItem("dnbar-staff")}catch(e){} render(); if(tk) sb.rpc("staff_logout",{p_token:tk}); return; }
   case "tab": S.view=v; break;
   case "filter": S.filter=v; break;
   case "open": openMesa(v); break;
   case "home": S.view="inicio"; break;
   case "openThis": S.openPick=v; S.people=2; S.sheet=shOpen(); break;
   case "openNew": S.openPick=null; S.people=2; S.sheet=shOpen(); break;
   case "pickT": S.openPick=v; S.sheet=(S.sheet===shTransfer)?shTransfer:shOpen(); break;
   case "ppl": S.people=Math.max(1,Math.min(30,S.people+ +v)); S.sheet=shOpen(); break;
   case "doOpen": { if(S.busy) return; S.busy=true; const id=S.openPick; const ok=await act("open_table",{p_table_id:T(id).dbid,p_people:S.people}); S.busy=false; if(ok){ openMesa(id); toast(`Mesa ${id} aberta`,"Pronta para lançar pedidos"); } return; }
   case "pickOrder": S.sheet=shPickOrder; break;
   case "order": S.mesa=v; S.view="pedido"; S.cart=[]; S.q=""; S.cat="top"; S.sheet=null; break;
   case "leaveOrder": S.view="mesa"; S.cart=[]; break;
   case "cat": S.cat=v; break;
   case "add": { const b=ALL.find(x=>x.n===+v); if((b.price===null&&!b.prices)||b.available===false) return; if(b.prices){S.sheet=shSize(b.n)} else addToCart(String(b.n)); break; }
   case "addp": addToCart(v); S.sheet=null; break;
   case "review": S.sent=null; S.sheet=shReview; break;
   case "inc": S.cart[+v].qty++; break;
   case "dec": if(--S.cart[+v].qty<=0) S.cart.splice(+v,1); if(!S.cart.length) S.sheet=null; break;
   case "note": { const c=S.cart[+v], n=el.dataset.n, i=c.notes.indexOf(n); i>-1?c.notes.splice(i,1):c.notes.push(n); break; }
   case "send": sendOrder(); return;
   case "afterSent": S.sheet=null; S.sent=null; S.view="mesa"; break;
   case "close": if(S.sent){S.sent=null;S.view="mesa"} S.sheet=null; break;
   case "deliver": { const t=T(v); await act("deliver_ready",{p_session_id:t.s.sid},`Mesa ${v}`,"Entrega registrada"); return; }
   case "ack": { const t=T(v); await act("ack_call",{p_session_id:t.s.sid},`Mesa ${v}`,"Chamado atendido"); return; }
   case "bill": S.mesa=v; S.sheet=shBill; break;
   case "payAll": { const t=T(S.mesa), B=billOf(t.s); if(!B.rem||S.busy) return; if(!confirm(`Registrar ${money(B.rem)} recebido em ${el.textContent.trim()} na mesa ${t.id}? A mesa será fechada.`)) return;
     S.busy=true; try{ await rpc("pay",{p_token:S.token,p_session_id:t.s.sid,p_method:v,p_amount_cents:B.rem,p_received_cents:null}); S.sheet=null; S.view="inicio"; await loadLive(); toast(`Mesa ${t.id} paga`,"Mesa fechada e liberada"); }
     catch(e){ toast("Não deu certo", /CAIXA_FECHADO/.test(e.message)?"O caixa está fechado. Peça para abrir o caixa.":isNetErr(e)?"Sem conexão. Tente de novo.":errMsg(e)); }
     S.busy=false; return; }
   case "toCashier": { const t=T(S.mesa); S.sheet=null; await act("send_to_cashier",{p_session_id:t.s.sid},`Mesa ${t.id}`,"Conta enviada para o caixa"); return; }
   case "transfer": S.mesa=v; S.openPick=null; S.sheet=shTransfer; break;
   case "doTransfer": { if(S.busy) return; S.busy=true; const from=T(S.mesa), to=S.openPick; const ok=await act("transfer_table",{p_session_id:from.s.sid,p_to_table:T(to).dbid}); S.busy=false;
     if(ok){ if(S.lastOrder[from.id]) S.lastOrder[to]=S.lastOrder[from.id]; openMesa(to); S.sheet=null; toast("Mesa transferida",`${from.id} → ${to}`); } return; }
   case "repeat": S.mesa=v; S.sheet=shRepeat; break;
   case "doRepeat": { const t=T(S.mesa); S.cart=lastRound(t).filter(c=>PROD[c.pid]).map(c=>({pid:c.pid,qty:c.qty,notes:[]})); S.view="pedido"; S.sent=null; S.sheet=S.cart.length?shReview:null; break; }
  }
  render();
});
document.addEventListener("keydown",e=>{
  if(S.auth&&!S.user&&S.pinFor&&!S.pinBusy&&/^\d$/.test(e.key)){S.pin+=e.key;S.pinErr="";if(S.pin.length===4){doPinLogin();return}render()}
  if(e.key==="Escape"&&S.sheet){S.sheet=null;S.sent=null;render()}
});
sb.auth.onAuthStateChange((ev,session)=>{ if(ev==="SIGNED_OUT"){ S.auth=null; S.loaded=false; S.user=null; render(); } else if(session) S.auth=session; });
document.addEventListener("gesturestart",e=>e.preventDefault());
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
render();
boot();
</script>
